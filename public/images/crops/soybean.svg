<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" fill="none">
  <rect width="400" height="280" rx="12" fill="#143a29"/>
  <rect y="180" width="400" height="100" fill="#0f2b1e"/>

  <!-- Soybean Pods and Trifoliate Foliage -->
  <g transform="translate(200, 60)">
    <!-- Main stem -->
    <path d="M0 170 Q-5 100 0 30" stroke="#4d7c0f" stroke-width="4"/>
    
    <!-- Trifoliate Leaves (Top) -->
    <path d="M0 30 Q-30 -10 -40 20 Q-20 40 0 30 Z" fill="#65a30d"/>
    <path d="M0 30 Q0 -30 20 -20 Q20 10 0 30 Z" fill="#84cc16"/>
    <path d="M0 30 Q40 -10 50 20 Q20 40 0 30 Z" fill="#65a30d"/>

    <!-- Green Soybean Pod Clusters -->
    <!-- Left Pod Cluster -->
    <g transform="translate(-10, 80) rotate(-20)">
      <path d="M0 0 C15 5 25 15 25 35 C20 45 5 40 0 25 C-5 15 0 5 0 0 Z" fill="#84cc16" stroke="#4d7c0f" stroke-width="1.5"/>
      <circle cx="10" cy="12" r="3" fill="#65a30d"/>
      <circle cx="12" cy="24" r="3" fill="#65a30d"/>
      <circle cx="10" cy="34" r="2.5" fill="#65a30d"/>
    </g>

    <!-- Right Pod Cluster -->
    <g transform="translate(15, 110) rotate(25)">
      <path d="M0 0 C15 5 25 15 25 35 C20 45 5 40 0 25 C-5 15 0 5 0 0 Z" fill="#a3e635" stroke="#4d7c0f" stroke-width="1.5"/>
      <circle cx="10" cy="12" r="3" fill="#65a30d"/>
      <circle cx="12" cy="24" r="3" fill="#65a30d"/>
      <circle cx="10" cy="34" r="2.5" fill="#65a30d"/>
    </g>
  </g>

  <!-- Title Badge in bottom corner -->
  <rect x="20" y="225" width="160" height="36" rx="6" fill="#1b4d36" stroke="#2e7d32" stroke-width="1"/>
  <text x="35" y="248" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff">
    SOYBEAN / सोयाबीन
  </text>
</svg>
