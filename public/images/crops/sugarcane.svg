<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" fill="none">
  <rect width="400" height="280" rx="12" fill="#143a29"/>
  <rect y="180" width="400" height="100" fill="#0f2b1e"/>

  <!-- Sugarcane Stalks with Segments and Long Canopy -->
  <g transform="translate(180, 20)">
    <!-- Stalk 1 (Left) -->
    <rect x="-30" y="50" width="16" height="180" rx="4" fill="#65a30d"/>
    <!-- Nodes -->
    <line x1="-30" y1="80" x2="-14" y2="80" stroke="#365314" stroke-width="3"/>
    <line x1="-30" y1="120" x2="-14" y2="120" stroke="#365314" stroke-width="3"/>
    <line x1="-30" y1="160" x2="-14" y2="160" stroke="#365314" stroke-width="3"/>
    <line x1="-30" y1="200" x2="-14" y2="200" stroke="#365314" stroke-width="3"/>

    <!-- Stalk 2 (Center) -->
    <rect x="0" y="30" width="18" height="200" rx="4" fill="#84cc16"/>
    <!-- Nodes -->
    <line x1="0" y1="65" x2="18" y2="65" stroke="#365314" stroke-width="3"/>
    <line x1="0" y1="105" x2="18" y2="105" stroke="#365314" stroke-width="3"/>
    <line x1="0" y1="145" x2="18" y2="145" stroke="#365314" stroke-width="3"/>
    <line x1="0" y1="185" x2="18" y2="185" stroke="#365314" stroke-width="3"/>

    <!-- Stalk 3 (Right) -->
    <rect x="30" y="55" width="16" height="175" rx="4" fill="#65a30d"/>
    <line x1="30" y1="85" x2="46" y2="85" stroke="#365314" stroke-width="3"/>
    <line x1="30" y1="125" x2="46" y2="125" stroke="#365314" stroke-width="3"/>
    <line x1="30" y1="165" x2="46" y2="165" stroke="#365314" stroke-width="3"/>

    <!-- Arching Sugarcane Leaves -->
    <path d="M-22 50 Q-100 20 -120 70 Q-70 50 -22 60" fill="#4d7c0f"/>
    <path d="M9 30 Q-60 -20 -90 30 Q-40 0 9 40" fill="#65a30d"/>
    <path d="M9 30 Q80 -20 110 30 Q60 0 9 40" fill="#4d7c0f"/>
    <path d="M38 55 Q110 25 130 75 Q80 55 38 65" fill="#65a30d"/>
  </g>

  <!-- Title Badge in bottom corner -->
  <rect x="20" y="225" width="150" height="36" rx="6" fill="#1b4d36" stroke="#2e7d32" stroke-width="1"/>
  <text x="35" y="248" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff">
    SUGARCANE / गन्ना
  </text>
</svg>
