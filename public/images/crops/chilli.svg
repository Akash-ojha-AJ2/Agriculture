<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" fill="none">
  <rect width="400" height="280" rx="12" fill="#143a29"/>
  <rect y="180" width="400" height="100" fill="#0f2b1e"/>

  <!-- Chilli Plant Illustration -->
  <g transform="translate(200, 70)">
    <!-- Branch structure -->
    <path d="M0 160 Q-10 100 0 40" stroke="#388e3c" stroke-width="4"/>
    <path d="M0 100 Q-50 70 -60 20" stroke="#388e3c" stroke-width="3"/>
    <path d="M0 80 Q60 50 70 10" stroke="#388e3c" stroke-width="3"/>

    <!-- Red Chilli Peppers -->
    <!-- Center Chilli -->
    <g transform="translate(-10, 40) rotate(-15)">
      <path d="M0 0 C5 3 5 12 0 16 C-2 30 -5 50 -15 65 C-8 45 2 25 2 12 Z" fill="#dc2626"/>
      <path d="M-2 0 Q0 -8 6 -10" stroke="#2e7d32" stroke-width="2.5" fill="none"/>
    </g>
    
    <!-- Right Green/Red Chilli -->
    <g transform="translate(50, 40) rotate(25)">
      <path d="M0 0 C5 3 5 12 0 16 C-2 30 -5 50 -15 65 C-8 45 2 25 2 12 Z" fill="#b91c1c"/>
      <path d="M-2 0 Q0 -8 6 -10" stroke="#2e7d32" stroke-width="2.5" fill="none"/>
    </g>

    <!-- Green Leaves -->
    <path d="M-60 20 Q-100 0 -110 30 Q-80 50 -60 20 Z" fill="#4caf50"/>
    <path d="M70 10 Q110 -10 120 20 Q90 40 70 10 Z" fill="#4caf50"/>
    <path d="M0 30 Q-30 0 -20 -30 Q0 -10 0 30 Z" fill="#2e7d32"/>
  </g>

  <!-- Title Badge in bottom corner -->
  <rect x="20" y="225" width="160" height="36" rx="6" fill="#1b4d36" stroke="#2e7d32" stroke-width="1"/>
  <text x="35" y="248" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff">
    CHILLI / मिर्च
  </text>
</svg>
