<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <!-- Clean Laboratory Background -->
  <rect width="800" height="600" fill="#f1f5f3"/>
  <rect y="380" width="800" height="220" fill="#e2e8f0"/>
  <line x1="0" y1="380" x2="800" y2="380" stroke="#cbd5e1" stroke-width="4"/>

  <!-- Lab Shelf in Background -->
  <rect x="100" y="120" width="600" height="12" fill="#94a3b8"/>
  
  <!-- Bottles on Shelf -->
  <rect x="140" y="60" width="30" height="60" rx="3" fill="#143a29"/>
  <rect x="180" y="50" width="35" height="70" rx="3" fill="#166534"/>
  <rect x="230" y="70" width="25" height="50" rx="3" fill="#2e7d32"/>
  <rect x="540" y="55" width="40" height="65" rx="3" fill="#143a29"/>
  <rect x="590" y="45" width="45" height="75" rx="3" fill="#1e6b45"/>

  <!-- Microscope on Lab Bench (Left) -->
  <g transform="translate(140, 220)">
    <!-- Base -->
    <rect x="0" y="140" width="100" height="20" rx="4" fill="#334155"/>
    <path d="M40 140 L40 50 C40 20 80 20 80 50 L80 80" stroke="#475569" stroke-width="14" fill="none"/>
    <!-- Stage -->
    <rect x="20" y="90" width="60" height="10" rx="2" fill="#1e293b"/>
    <!-- Eyepiece / Objective -->
    <rect x="65" y="20" width="18" height="40" rx="2" fill="#0f172a"/>
    <rect x="68" y="75" width="12" height="20" rx="1" fill="#c97a1e"/>
  </g>

  <!-- Chemical Flasks & Beakers with Green Plant Extract (Center/Right) -->
  <!-- Erlenmeyer Flask (Large) -->
  <g transform="translate(340, 240)">
    <path d="M50 0 L70 0 L70 30 L110 120 L10 120 L50 30 Z" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <!-- Liquid -->
    <path d="M20 120 L100 120 L85 70 L35 70 Z" fill="#22c55e"/>
    <circle cx="55" cy="85" r="4" fill="#ffffff"/>
    <circle cx="70" cy="95" r="3" fill="#ffffff"/>
    <!-- Measurement lines -->
    <line x1="55" y1="50" x2="65" y2="50" stroke="#64748b" stroke-width="1.5"/>
    <line x1="50" y1="70" x2="70" y2="70" stroke="#64748b" stroke-width="1.5"/>
    <line x1="45" y1="90" x2="75" y2="90" stroke="#64748b" stroke-width="1.5"/>
  </g>

  <!-- Test Tube Rack (Right) -->
  <g transform="translate(520, 260)">
    <rect x="0" y="80" width="160" height="20" rx="3" fill="#475569"/>
    <rect x="0" y="30" width="160" height="8" rx="2" fill="#64748b"/>
    
    <!-- Test Tubes -->
    <rect x="25" y="0" width="16" height="90" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="27" y="40" width="12" height="48" rx="6" fill="#15803d"/>
    
    <rect x="65" y="0" width="16" height="90" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="67" y="55" width="12" height="33" rx="6" fill="#c97a1e"/>
    
    <rect x="105" y="0" width="16" height="90" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="107" y="30" width="12" height="58" rx="6" fill="#166534"/>
  </g>

  <!-- Plant Shoot in Petri Dish -->
  <g transform="translate(300, 350)">
    <ellipse cx="40" cy="20" rx="40" ry="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <path d="M40 20 Q50 5 60 10 Q45 20 40 20 Z" fill="#22c55e"/>
    <path d="M40 20 Q30 8 20 14 Q35 22 40 20 Z" fill="#15803d"/>
  </g>
</svg>
