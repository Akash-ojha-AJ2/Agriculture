<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" fill="none">
  <!-- Sky (Solid Warm Morning Light Blue) -->
  <rect width="1200" height="400" fill="#e8f3ee"/>
  
  <!-- Morning Sun (Solid Warm Gold) -->
  <circle cx="950" cy="180" r="70" fill="#fcd34d"/>
  
  <!-- Distant Hill Range (Solid Sage Muted Green) -->
  <path d="M0 380 Q280 280 600 350 Q900 290 1200 360 L1200 420 L0 420 Z" fill="#b7cfc1"/>
  
  <!-- Midground Tree Canopy & Village Treeline -->
  <path d="M0 400 C150 360 250 370 380 390 C500 370 650 360 800 390 C950 370 1080 365 1200 400 L1200 440 L0 440 Z" fill="#2d6a4f"/>
  
  <!-- Farmland Terraces & Cultivated Green Rows -->
  <path d="M0 430 L1200 430 L1200 680 L0 680 Z" fill="#1b4d36"/>
  
  <!-- Perspective Crop Rows (Solid Crisp Agricultural Green) -->
  <polygon points="100,680 250,680 500,430 480,430" fill="#2d7a51"/>
  <polygon points="350,680 500,680 620,430 600,430" fill="#388e3c"/>
  <polygon points="600,680 750,680 740,430 720,430" fill="#2d7a51"/>
  <polygon points="850,680 1000,680 860,430 840,430" fill="#388e3c"/>
  <polygon points="1050,680 1200,680 980,430 960,430" fill="#2d7a51"/>

  <!-- Furrows / Earth Channels (Solid Rich Soil Earth) -->
  <polygon points="0,680 80,680 470,430 460,430" fill="#143a29"/>
  <polygon points="260,680 330,680 590,430 580,430" fill="#143a29"/>
  <polygon points="510,680 580,680 710,430 700,430" fill="#143a29"/>
  <polygon points="760,680 830,680 830,430 820,430" fill="#143a29"/>
  <polygon points="1010,680 1040,680 950,430 940,430" fill="#143a29"/>

  <!-- Subtle Indian Farmland Contour Accents -->
  <circle cx="180" cy="360" r="18" fill="#1e5c3c"/>
  <circle cx="210" cy="355" r="22" fill="#27704b"/>
  <circle cx="240" cy="362" r="16" fill="#1e5c3c"/>
  
  <circle cx="780" cy="355" r="24" fill="#27704b"/>
  <circle cx="820" cy="350" r="28" fill="#1e5c3c"/>
  <circle cx="860" cy="358" r="20" fill="#27704b"/>
</svg>
