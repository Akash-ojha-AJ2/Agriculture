<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <!-- Sky background -->
  <rect width="800" height="600" fill="#eaf4ee"/>
  <!-- Field backdrop -->
  <rect y="320" width="800" height="280" fill="#1b4d36"/>
  <rect y="400" width="800" height="200" fill="#143a29"/>

  <!-- Crop rows in background -->
  <path d="M0 340 L800 340" stroke="#2e7d32" stroke-width="8"/>
  <path d="M0 380 L800 380" stroke="#388e3c" stroke-width="12"/>

  <!-- Stylized Agronomist and Farmer in Field -->
  <!-- Agronomist (Right) -->
  <g transform="translate(480, 180)">
    <!-- Body / Coat -->
    <path d="M60 160 L40 380 L140 380 L120 160 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <path d="M60 160 L90 220 L120 160" stroke="#166534" stroke-width="3" fill="none"/>
    <rect x="80" y="165" width="20" height="50" fill="#166534"/>
    <!-- Head & Hair -->
    <ellipse cx="90" cy="110" rx="28" ry="34" fill="#c49a6c"/>
    <path d="M60 100 C60 65 120 65 120 100 C110 80 70 80 60 100 Z" fill="#1f2937"/>
    <!-- Clipboard / Tablet -->
    <rect x="25" y="240" width="45" height="60" rx="4" fill="#1e293b"/>
    <rect x="30" y="245" width="35" height="50" fill="#f8fafc"/>
    <line x1="35" y1="255" x2="58" y2="255" stroke="#0f172a" stroke-width="2"/>
    <line x1="35" y1="265" x2="58" y2="265" stroke="#0f172a" stroke-width="2"/>
    <line x1="35" y1="275" x2="52" y2="275" stroke="#16a34a" stroke-width="2"/>
  </g>

  <!-- Farmer with Turban (Left) -->
  <g transform="translate(220, 200)">
    <!-- Body (Kurta) -->
    <path d="M60 140 L35 360 L145 360 L120 140 Z" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <path d="M75 140 L90 200 L105 140" stroke="#d97706" stroke-width="2" fill="none"/>
    <!-- Head -->
    <ellipse cx="90" cy="95" rx="28" ry="32" fill="#b08359"/>
    <!-- Turban (Traditional Ochre/Saffron solid) -->
    <ellipse cx="90" cy="65" rx="38" ry="24" fill="#d97706"/>
    <path d="M52 65 C60 40 120 40 128 65 C115 50 65 50 52 65 Z" fill="#b45309"/>
    <!-- Holding Healthy Crop Shoot -->
    <path d="M125 240 Q160 210 180 180" stroke="#16a34a" stroke-width="4"/>
    <ellipse cx="180" cy="180" rx="8" ry="16" transform="rotate(30 180 180)" fill="#22c55e"/>
    <ellipse cx="165" cy="195" rx="8" ry="14" transform="rotate(-30 165 195)" fill="#16a34a"/>
  </g>

  <!-- Foreground Leaf Detail -->
  <path d="M0 600 Q150 480 300 600 Z" fill="#2d7a51"/>
  <path d="M500 600 Q650 490 800 600 Z" fill="#2d7a51"/>
</svg>
