<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <!-- Precision Testing Room Background -->
  <rect width="800" height="600" fill="#f8faf9"/>
  <rect y="380" width="800" height="220" fill="#e5e7eb"/>
  <line x1="0" y1="380" x2="800" y2="380" stroke="#cbd5e1" stroke-width="4"/>

  <!-- High-Tech Quality Analysis Machine (HPLC / Spectrophotometer) -->
  <g transform="translate(160, 160)">
    <!-- Machine Enclosure -->
    <rect x="0" y="0" width="280" height="220" rx="8" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
    
    <!-- Status Display Panel -->
    <rect x="30" y="30" width="140" height="80" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="40" y="55" font-family="monospace" font-size="10" font-weight="700" fill="#22c55e">BATCH QA: PASS</text>
    <polyline points="40,85 60,75 80,90 100,60 120,80 140,70 160,85" stroke="#22c55e" stroke-width="2" fill="none"/>

    <!-- Keypad / Control Knobs -->
    <circle cx="210" cy="50" r="12" fill="#334155"/>
    <circle cx="245" cy="50" r="8" fill="#c97a1e"/>
    <rect x="200" y="80" width="55" height="10" rx="2" fill="#475569"/>
    <rect x="200" y="95" width="55" height="10" rx="2" fill="#475569"/>

    <!-- Sample Autosampler Chamber -->
    <rect x="30" y="130" width="220" height="70" rx="4" fill="#334155"/>
    <!-- Vials inside -->
    <circle cx="60" cy="165" r="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="95" cy="165" r="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="130" cy="165" r="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="165" cy="165" r="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="200" cy="165" r="10" fill="#22c55e"/>
  </g>

  <!-- Quality Stamp / Certified Shield on Right -->
  <g transform="translate(520, 200)">
    <circle cx="100" cy="100" r="90" fill="#143a29"/>
    <circle cx="100" cy="100" r="80" stroke="#c97a1e" stroke-width="3" stroke-dasharray="6,4"/>
    <path d="M100 45 L140 60 C140 115 120 135 100 150 C80 135 60 115 60 60 Z" fill="#166534" stroke="#ffffff" stroke-width="2"/>
    <path d="M85 95 L95 105 L118 80" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <text x="100" y="175" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">
      100% QUALITY ASSURED
    </text>
  </g>
</svg>
