<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" fill="none">
  <rect width="320" height="420" rx="16" fill="#f4f7f5"/>
  <ellipse cx="160" cy="385" rx="85" ry="14" fill="#d5ded8"/>
  
  <!-- Agrochemical Bottle Container -->
  <rect x="132" y="45" width="56" height="28" rx="4" fill="#0369a1"/>
  <rect x="136" y="40" width="48" height="8" rx="2" fill="#0284c7"/>
  <line x1="144" y1="45" x2="144" y2="73" stroke="#0284c7" stroke-width="2"/>
  <line x1="152" y1="45" x2="152" y2="73" stroke="#0284c7" stroke-width="2"/>
  <line x1="160" y1="45" x2="160" y2="73" stroke="#0284c7" stroke-width="2"/>
  <line x1="168" y1="45" x2="168" y2="73" stroke="#0284c7" stroke-width="2"/>
  <line x1="176" y1="45" x2="176" y2="73" stroke="#0284c7" stroke-width="2"/>

  <!-- Neck & Shoulder -->
  <path d="M136 73 L184 73 L184 95 L225 130 L225 365 L95 365 L95 130 L136 95 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  
  <!-- Main Product Label -->
  <rect x="110" y="145" width="100" height="205" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  
  <!-- Top Brand Banner -->
  <rect x="110" y="145" width="100" height="28" fill="#143a29"/>
  <text x="160" y="162" font-family="system-ui, sans-serif" font-size="8" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">
    HYDERABAD CROP SCIENCE
  </text>

  <!-- Category Band (Fungicide - Royal Blue/Deep Teal) -->
  <rect x="110" y="173" width="100" height="14" fill="#0369a1"/>
  <text x="160" y="183" font-family="system-ui, sans-serif" font-size="8" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">
    SYSTEMIC FUNGICIDE
  </text>

  <!-- Product Name -->
  <text x="160" y="222" font-family="system-ui, sans-serif" font-size="22" font-weight="900" fill="#143a29" text-anchor="middle" letter-spacing="1.5">
    HAITOR
  </text>

  <!-- Active Ingredient & Formulation -->
  <text x="160" y="240" font-family="system-ui, sans-serif" font-size="7.5" font-weight="700" fill="#334155" text-anchor="middle">
    Hexaconazole 5% SC
  </text>
  <text x="160" y="252" font-family="system-ui, sans-serif" font-size="6.5" font-weight="500" fill="#64748b" text-anchor="middle">
    Broad Spectrum Triazole
  </text>

  <!-- Antifungal Shield Icon -->
  <path d="M160 262 L172 268 L160 286 L148 268 Z" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
  <circle cx="160" cy="274" r="3" fill="#0369a1"/>

  <!-- Toxicity Warning Triangle (Blue for Class III) -->
  <polygon points="152,320 168,320 160,306" fill="#0284c7" stroke="#0369a1" stroke-width="1"/>
  <text x="160" y="318" font-family="system-ui, sans-serif" font-size="6" font-weight="700" fill="#ffffff" text-anchor="middle">
    !
  </text>

  <text x="160" y="334" font-family="system-ui, sans-serif" font-size="6.5" font-weight="700" fill="#0369a1" text-anchor="middle">
    CAUTION
  </text>
  <text x="160" y="344" font-family="system-ui, sans-serif" font-size="6" font-weight="500" fill="#475569" text-anchor="middle">
    Net Vol: 500 ml / 1 Litre
  </text>
</svg>
