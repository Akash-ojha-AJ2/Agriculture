<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" fill="none">
  <rect width="320" height="420" rx="16" fill="#f4f7f5"/>
  <ellipse cx="160" cy="385" rx="85" ry="14" fill="#d5ded8"/>
  
  <!-- Agrochemical Bottle Container (Amber/White bottle with Red/Yellow Cap) -->
  <rect x="132" y="45" width="56" height="28" rx="4" fill="#dc2626"/>
  <rect x="136" y="40" width="48" height="8" rx="2" fill="#ef4444"/>
  <line x1="144" y1="45" x2="144" y2="73" stroke="#b91c1c" stroke-width="2"/>
  <line x1="152" y1="45" x2="152" y2="73" stroke="#b91c1c" stroke-width="2"/>
  <line x1="160" y1="45" x2="160" y2="73" stroke="#b91c1c" stroke-width="2"/>
  <line x1="168" y1="45" x2="168" y2="73" stroke="#b91c1c" stroke-width="2"/>
  <line x1="176" y1="45" x2="176" y2="73" stroke="#b91c1c" stroke-width="2"/>

  <!-- Neck & Shoulder -->
  <path d="M136 73 L184 73 L184 95 L225 130 L225 365 L95 365 L95 130 L136 95 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  
  <!-- Main Product Label -->
  <rect x="110" y="145" width="100" height="205" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  
  <!-- Top Brand Banner -->
  <rect x="110" y="145" width="100" height="28" fill="#143a29"/>
  <text x="160" y="162" font-family="system-ui, sans-serif" font-size="8" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">
    HYDERABAD CROP SCIENCE
  </text>

  <!-- Category Band (Neonicotinoid Systemic Insecticide) -->
  <rect x="110" y="173" width="100" height="14" fill="#15803d"/>
  <text x="160" y="183" font-family="system-ui, sans-serif" font-size="8" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">
    SYSTEMIC INSECTICIDE
  </text>

  <!-- Product Name -->
  <text x="160" y="222" font-family="system-ui, sans-serif" font-size="21" font-weight="900" fill="#143a29" text-anchor="middle" letter-spacing="1.2">
    SHIMDOR
  </text>

  <!-- Active Ingredient & Formulation -->
  <text x="160" y="240" font-family="system-ui, sans-serif" font-size="7.5" font-weight="700" fill="#334155" text-anchor="middle">
    Imidacloprid 17.8% SL
  </text>
  <text x="160" y="252" font-family="system-ui, sans-serif" font-size="6.5" font-weight="500" fill="#64748b" text-anchor="middle">
    Sucking Pest Specialist
  </text>

  <!-- Sucking pest target icon -->
  <circle cx="160" cy="275" r="13" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <circle cx="160" cy="275" r="4" fill="#b91c1c"/>

  <!-- Toxicity Warning Triangle (Yellow Triangle for Class II Moderately Hazardous) -->
  <polygon points="152,320 168,320 160,306" fill="#eab308" stroke="#ca8a04" stroke-width="1"/>
  <text x="160" y="318" font-family="system-ui, sans-serif" font-size="6" font-weight="800" fill="#000000" text-anchor="middle">
    !
  </text>

  <text x="160" y="334" font-family="system-ui, sans-serif" font-size="6.5" font-weight="700" fill="#a16207" text-anchor="middle">
    DANGER
  </text>
  <text x="160" y="344" font-family="system-ui, sans-serif" font-size="6" font-weight="500" fill="#475569" text-anchor="middle">
    Net Vol: 250 ml / 500 ml
  </text>
</svg>
