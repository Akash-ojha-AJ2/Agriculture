<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" fill="none">
  <rect width="320" height="420" rx="16" fill="#f4f7f5"/>
  <ellipse cx="160" cy="385" rx="90" ry="14" fill="#d5ded8"/>
  
  <!-- Jerrycan Body with Handle -->
  <!-- Handle -->
  <path d="M110 80 C110 65 140 60 180 60 C210 60 220 75 220 95 L220 115 L190 115 L190 85 C190 80 180 75 160 75 C140 75 135 80 135 85 L135 115 L110 115 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  
  <!-- Canister Cap -->
  <rect x="200" y="55" width="36" height="24" rx="3" fill="#143a29"/>
  <line x1="208" y1="55" x2="208" y2="79" stroke="#2d6a4f" stroke-width="2"/>
  <line x1="218" y1="55" x2="218" y2="79" stroke="#2d6a4f" stroke-width="2"/>
  <line x1="228" y1="55" x2="228" y2="79" stroke="#2d6a4f" stroke-width="2"/>

  <!-- Main Canister Hull -->
  <rect x="80" y="115" width="160" height="250" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Label Area -->
  <rect x="95" y="140" width="130" height="205" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  
  <!-- Top Banner -->
  <rect x="95" y="140" width="130" height="26" fill="#143a29"/>
  <text x="160" y="157" font-family="system-ui, sans-serif" font-size="8" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">
    HYDERABAD CROP SCIENCE
  </text>

  <!-- Category Band (Non-Selective Herbicide - Solid Amber/Dark Green) -->
  <rect x="95" y="166" width="130" height="14" fill="#c97a1e"/>
  <text x="160" y="176" font-family="system-ui, sans-serif" font-size="8" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">
    NON-SELECTIVE HERBICIDE
  </text>

  <!-- Product Name -->
  <text x="160" y="218" font-family="system-ui, sans-serif" font-size="24" font-weight="900" fill="#143a29" text-anchor="middle" letter-spacing="2">
    TUFAN
  </text>

  <!-- Active Ingredient -->
  <text x="160" y="238" font-family="system-ui, sans-serif" font-size="8" font-weight="700" fill="#334155" text-anchor="middle">
    Glyphosate 41% SL
  </text>
  <text x="160" y="250" font-family="system-ui, sans-serif" font-size="7" font-weight="500" fill="#64748b" text-anchor="middle">
    Soluble Liquid
  </text>

  <!-- Weed Eradication Shield -->
  <circle cx="160" cy="275" r="14" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <path d="M153 275 L167 275" stroke="#b45309" stroke-width="2.5"/>

  <!-- Toxicity Warning Triangle (Blue) -->
  <polygon points="152,316 168,316 160,302" fill="#0284c7" stroke="#0369a1" stroke-width="1"/>
  <text x="160" y="314" font-family="system-ui, sans-serif" font-size="6" font-weight="700" fill="#ffffff" text-anchor="middle">
    !
  </text>

  <text x="160" y="328" font-family="system-ui, sans-serif" font-size="6.5" font-weight="700" fill="#0369a1" text-anchor="middle">
    CAUTION
  </text>
  <text x="160" y="338" font-family="system-ui, sans-serif" font-size="6.5" font-weight="600" fill="#475569" text-anchor="middle">
    Net Vol: 1 Litre / 5 Litres
  </text>
</svg>
