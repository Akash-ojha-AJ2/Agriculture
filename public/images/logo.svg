    <!-- Central Golden Seed Accent -->
    <circle cx="30" cy="46" r="3" fill="#c97a1e"/>
  </g>
  
  <!-- Company Typography -->
  <!-- Main Name -->
  <text x="80" y="36" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="800" fill="#143a29" letter-spacing="0.5">
